apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Allocate under an exclusive lock; repeated builds and clock rollback cannot reuse a version code.
def versionArgs = [System.getenv('BRIDGE_BUN_PATH') ?: 'bun', '../scripts/mobile-version.mjs']
if (project.hasProperty('androidVersionCode')) versionArgs.add(project.property('androidVersionCode').toString())
def generatedVersion = providers.exec { workingDir rootProject.projectDir; commandLine versionArgs }.standardOutput.asText.get()
def mobileVersion = new groovy.json.JsonSlurper().parseText(generatedVersion)
def mobileVersionCode = mobileVersion.versionCode.toInteger()
def mobileVersionName = mobileVersion.versionName.toString()

android {
    namespace = "dev.feishu.codex.bridge"
    compileSdk {
        version = release(rootProject.ext.compileSdkVersion) {
            minorApiLevel = rootProject.ext.compileSdkMinorApiLevel
        }
    }
    defaultConfig {
        applicationId "dev.feishu.codex.bridge"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // This development APK targets the local Apple Silicon/ARM64 phone.
        // Release distribution should use an Android App Bundle for per-device ABI delivery.
        ndk {
            abiFilters "arm64-v8a"
        }
        versionCode mobileVersionCode
        versionName mobileVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        aidl = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Direct Android SSH transport. 0.39.0 is Java 8 compatible and includes
    // the Terrapin mitigation; BC is pinned explicitly for Android crypto
    // provider registration and modern OpenSSH host keys.
    implementation 'com.hierynomus:sshj:0.39.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    // ConnectBot's embeddable SSH/PTY transport. The old sshj path remains
    // available as an explicit fallback while native migration is verified.
    implementation 'org.connectbot.sshlib:sshlib:0.5.0'
    implementation 'org.connectbot:termlib:0.3.13'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Real JSON parsing in JVM bridge regression tests instead of Android's stub JSONObject.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
